<text x="74.0" y="798.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="400" fill="#E6EDF3" text-anchor="start">Expected: the AI wrote a</text>
