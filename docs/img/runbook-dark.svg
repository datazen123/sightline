<text x="74.0" y="662.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="400" fill="#E6EDF3" text-anchor="start">Set</text>
<text x="74.0" y="686.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="400" fill="#E6EDF3" text-anchor="start">SIGHTLINE_PRICE_&lt;MODEL&gt; in</text>
