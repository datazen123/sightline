<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 944" width="400" height="944" role="img" aria-label="Troubleshooting: find the message the audit printed, apply the matching fix.">
<title>Troubleshooting: find the message the audit printed, apply the matching fix.</title>
<rect width="400" height="944" rx="16" fill="#0D1117"/>
<text x="14.0" y="40.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#E6EDF3" text-anchor="start">Audit failed or looks</text>
<text x="14.0" y="66.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#E6EDF3" text-anchor="start">wrong?</text>
<text x="14.0" y="90.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#9DA7B3" text-anchor="start">Match the message it printed to its fix.</text>
<rect x="60.0" y="114.0" width="326.0" height="126.0" rx="12" fill="#3B1416" stroke="#F87171" stroke-width="2"/>
<text x="72.0" y="140.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#F87171" text-anchor="start">file rejected: unknown headers</text>
<text x="74.0" y="166.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="400" fill="#E6EDF3" text-anchor="start">Add an AI key, or add header</text>
<text x="74.0" y="190.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="400" fill="#E6EDF3" text-anchor="start">synonyms to the corpus</text>
<text x="74.0" y="214.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="400" fill="#E6EDF3" text-anchor="start">schema</text>
