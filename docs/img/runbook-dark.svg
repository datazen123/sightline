<text x="72.0" y="276.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#F87171" text-anchor="start">file rejected: totals off</text>
<text x="74.0" y="302.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="400" fill="#E6EDF3" text-anchor="start">The input is wrong. Fix the file;</text>
<text x="74.0" y="326.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="400" fill="#E6EDF3" text-anchor="start">never loosen the check</text>
<rect x="60.0" y="362.0" width="326.0" height="102.0" rx="12" fill="#3B1416" stroke="#F87171" stroke-width="2"/>
<text x="72.0" y="388.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#F87171" text-anchor="start">No rate agreement found</text>
<text x="74.0" y="414.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="400" fill="#E6EDF3" text-anchor="start">Put the contract_marker phrase</text>
<text x="74.0" y="438.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="400" fill="#E6EDF3" text-anchor="start">on page 1 of the contract PDF</text>
<rect x="60.0" y="474.0" width="326.0" height="126.0" rx="12" fill="#3B1416" stroke="#F87171" stroke-width="2"/>
<text x="72.0" y="500.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#F87171" text-anchor="start">terms failed verification</text>
<text x="74.0" y="526.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="400" fill="#E6EDF3" text-anchor="start">The named term is missing,</text>
<text x="74.0" y="550.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="400" fill="#E6EDF3" text-anchor="start">out of range, or not on its cited</text>
<text x="74.0" y="574.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="400" fill="#E6EDF3" text-anchor="start">page</text>
<rect x="60.0" y="610.0" width="326.0" height="126.0" rx="12" fill="#1F2630" stroke="#8B949E" stroke-width="2"/>
