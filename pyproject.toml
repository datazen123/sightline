[project]
name = "sightline"
version = "0.2.0"
description = "Document and spend audit engine: LLMs read, deterministic code computes, every finding cited."
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.120.2",
    "duckdb>=2.0.1",
    "fastapi>=0.165.0",
    "fastmcp>=3.4.5",
    "fpdf2>=2.8.7",
    "google-genai>=3.6.1",
    "openpyxl>=3.1.5",
    "pdfplumber>=0.11.10",
    "pydantic>=2.13.4",
    "pypdf>=6.14.2",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "streamlit>=1.60.0",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[project.scripts]
sightline = "sightline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sightline", "agents", "server", "corpora", "api"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["web"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"api/main.py" = ["B008"]  # FastAPI dependency-injection idiom
"app/streamlit_app.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
